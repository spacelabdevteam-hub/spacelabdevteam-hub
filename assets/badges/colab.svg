<svg xmlns="http://www.w3.org/2000/svg" width="178" height="20" viewBox="0 0 178 20" role="img" aria-label="Reproducible Google Colab Benchmark Notebook">
  <title>Reproducible Google Colab Benchmark Notebook</title>
  <clipPath id="r"><rect width="178" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="46" height="20" fill="#0E1618"/>
    <rect x="46" width="132" height="20" fill="#15283E"/>
    <rect x="46" y="1" width="1" height="18" fill="#2B4C73"/>
  </g>
  <rect x="0.5" y="0.5" width="177" height="19" rx="2.5" fill="none" stroke="#2B4C73" stroke-width="1"/>
  
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="23.0" y="13.8" text-anchor="middle" fill="#E8C57D" font-weight="500">Colab</text>
    <text x="112.0" y="13.8" text-anchor="middle" fill="#F1F5F9" font-weight="600">Benchmark Notebook</text>
